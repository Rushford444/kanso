name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1
        with:
          toolchain: 1.88.0
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      - run: cargo test --locked
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@96601b43a0a57b0296684a021efcfa250db2e2cc # nextest and cargo-deny
        with:
          tool: nextest,cargo-deny
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      - run: cargo nextest run --locked --no-fail-fast
      - run: cargo test --doc --locked
      - run: cargo deny check
      - run: python3 scripts/check_package.py
